mcp.connect.desktop.title=Claude Desktop
mcp.connect.desktop.1=Öffnen Sie <strong>Einstellungen → Konnektoren</strong> und wählen Sie <strong>Hinzufügen → Benutzerdefinierten Konnektor hinzufügen</strong>.
mcp.connect.desktop.2=Tragen Sie einen <strong>Namen</strong> (z. B. „faktura“) und die <strong>Adresse des MCP-Servers</strong> von oben ein und klicken Sie auf <strong>Weiter</strong>.
mcp.connect.desktop.3=Wählen Sie bei der Authentifizierung <strong>Keine Anmeldung</strong>. „Jetzt anmelden“ erwartet OAuth, das faktura nicht anbietet.
mcp.connect.desktop.4=Klicken Sie unter „Request-Header“ auf <strong>Header hinzufügen</strong>, wählen Sie als Namen <strong>{0}</strong> und tragen Sie als Wert nur den <strong>Token</strong> ein, ohne „Bearer“. „Erforderlich“ bleibt angehakt. Andere Namen verlangen eine Genehmigung von Anthropic.
mcp.connect.desktop.5=Speichern Sie den Konnektor. Unter „Tool-Berechtigungen“ können Sie die Lesewerkzeuge auf „Immer erlauben“ stellen; „Create invoice draft“ und „Create offer draft“ lassen Sie auf „Genehmigung erforderlich“.
mcp.connect.code.title=Claude Code
mcp.connect.code.lead=Führen Sie im Terminal diesen Befehl aus und ersetzen Sie <Token> durch Ihren Token:
mcp.connect.code.hint=Danach in Claude Code mit /mcp prüfen, ob „faktura“ verbunden ist.
mcp.connect.proxy=Die Adresse muss ohne Anmeldung am vorgeschalteten Proxy (z. B. Pangolin mit Authentik) erreichbar sein: für den Pfad /mcp eine Ausnahme einrichten, damit nur der Token schützt. Die Beschreibung stimmt mit den Menünamen von Claude zum Zeitpunkt der Erstellung überein; sie können sich ändern.
