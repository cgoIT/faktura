<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="select(current)">
  <!-- Typing the first letters of a country jumps to it. A stored code that is not in the list stays selectable.
       Must be used inside a form whose object has a "country" property. -->
  <select id="country" th:field="*{country}">
    <option th:if="${current != null and !current.isBlank() and !#lists.contains(countries.![code], current)}"
            th:value="${current}" th:text="${current}"></option>
    <option th:each="country : ${countries}" th:value="${country.code}" th:text="${country.name}"></option>
  </select>
</th:block>
