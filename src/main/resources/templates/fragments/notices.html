<div xmlns:th="http://www.thymeleaf.org" th:fragment="notices">
  <div class="notice success" role="status" th:if="${message != null}" th:text="#{${message}}"></div>
  <div class="notice error" role="alert" th:if="${error != null}" >
    <span th:text="#{${error}}"></span>
    <ul th:if="${errorDetails != null and !errorDetails.isEmpty()}">
      <li th:each="detail : ${errorDetails}"
          th:text="${#messages.msgOrNull('einvoice.rule.' + detail)} ?: #{einvoice.rule.unknown(${detail})}"></li>
    </ul>
  </div>
</div>
