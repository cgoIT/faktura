<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::main}, '')}">
<head>
  <title th:text="#{account.title} + ' – Faktura'">Passwort ändern</title>
</head>
<body>
<main class="wide form-width">
  <h1 th:text="#{account.title}">Passwort ändern</h1>
  <div th:replace="~{fragments/notices :: notices}"></div>
  <form method="post" th:action="@{/account/password}" class="card stack">
    <div class="field">
      <label for="currentPassword" th:text="#{account.current}">Aktuelles Passwort</label>
      <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="newPassword" th:text="#{account.new}">Neues Passwort</label>
      <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required
             th:attr="minlength=${minPasswordLength}">
      <span class="hint" th:text="#{user.password.hint(${minPasswordLength})}">Mindestens 12 Zeichen.</span>
    </div>
    <div class="field">
      <label for="newPasswordRepeat" th:text="#{account.newRepeat}">Neues Passwort wiederholen</label>
      <input type="password" id="newPasswordRepeat" name="newPasswordRepeat" autocomplete="new-password" required
             th:attr="minlength=${minPasswordLength}">
    </div>
    <div class="actions">
      <button type="submit" th:text="#{account.submit}">Passwort ändern</button>
    </div>
  </form>
</main>
</body>
</html>
