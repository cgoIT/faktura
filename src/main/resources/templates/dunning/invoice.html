<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="card" th:fragment="panel" th:if="${!#lists.isEmpty(letters) or !#lists.isEmpty(available)}">
  <h2 th:text="#{dunning.title}">Mahnwesen</h2>
  <p th:if="${balance != null and !#lists.isEmpty(letters)}">
    <span th:text="#{dunning.invoiceState} + ':'">Rechnung:</span>
    <span th:replace="~{dunning/state :: badge(${balance})}"></span>
  </p>
  <div class="table-scroll" th:unless="${#lists.isEmpty(letters)}">
    <table>
      <thead>
      <tr>
        <th th:text="#{dunning.number}">Mahnnummer</th>
        <th th:text="#{dunning.level}">Stufe</th>
        <th th:text="#{payment.date}">Datum</th>
        <th class="num" th:text="#{dunning.total}">Forderung</th>
        <th th:text="#{dunning.newDueDate}">Neue Frist</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="letter : ${letters}">
        <td class="mono"><a th:href="@{/dunning/{id}(id=${letter.id})}" th:text="${letter.number}">MA202600001</a></td>
        <td th:text="${letter.levelName}">1. Mahnung</td>
        <td th:text="${#temporals.format(letter.date, 'dd.MM.yyyy')}">20.10.2026</td>
        <td class="num" th:text="${@money.format(letter.totalCents)}">0,00 €</td>
        <td th:text="${#temporals.format(letter.newDueDate, 'dd.MM.yyyy')}">27.10.2026</td>
        <td class="row-actions"><a class="button secondary" target="_blank" th:href="@{/dunning/{id}/pdf(id=${letter.id})}"
               th:text="#{invoice.pdf}">PDF öffnen</a></td>
      </tr>
      </tbody>
    </table>
  </div>
  <div class="form-grid" th:unless="${#lists.isEmpty(available)}">
    <div class="field">
      <label for="dunning-level" th:text="#{dunning.level}">Stufe</label>
      <select id="dunning-level" name="levelId">
        <option th:each="level : ${available}" th:value="${level.id}" th:text="${level.name}">Zahlungserinnerung</option>
      </select>
    </div>
    <div class="actions">
      <button type="button" th:attr="hx-get=@{/dunning/confirm(invoiceId=${invoiceId},from='invoice')}"
              hx-include="#dunning-level" hx-target="#dunning-dialog" hx-swap="innerHTML"
              th:text="#{dunning.create}">Mahnung erstellen</button>
    </div>
  </div>
  <dialog id="dunning-dialog" class="review-dialog" data-htmx-dialog aria-labelledby="dunning-title"></dialog>
</section>
</body>
</html>
