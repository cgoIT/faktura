name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '25'
          cache: maven
      # SQLite-Tests laufen immer, die PostgreSQL-Tests nutzen das Docker des Runners (Testcontainers).
      - name: Build und Tests
        run: ./mvnw -B -ntp verify
      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports

  # Baut das Container-Image (ohne Push) und startet es einmal: Health-Check und Sperre des dev-Profils.
  image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Image bauen
        run: docker build -t faktura:ci .
      - name: Start und Health-Check
        run: |
          docker run -d --name faktura -p 8080:8080 faktura:ci
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "faktura ist gestartet"
              exit 0
            fi
            sleep 3
          done
          docker logs faktura
          exit 1
      - name: dev-Profil im Container wird abgelehnt
        run: |
          if docker run --rm -e SPRING_PROFILES_ACTIVE=dev faktura:ci; then
            echo "Das dev-Profil darf im Container nicht starten"
            exit 1
          fi
