name: Publish image

# Builds the container image for a release tag and pushes it to the GitHub Container Registry
# (ghcr.io/<owner>/faktura). Called by release-please.yml; can also be started by hand for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v1.0.1
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.0.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # keyless signing with cosign
      attestations: write  # build provenance
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # Registry names must be lower case, the repository name (cgoIT/faktura) is not.
      - name: Image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags for v1.0.1: 1.0.1, 1.0, 1 and latest (for 0.x the major tag is 0).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=semver,pattern={{major}},value=${{ inputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=faktura
            org.opencontainers.image.licenses=Apache-2.0

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signature and provenance let users verify that the image was built from this repository.
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
