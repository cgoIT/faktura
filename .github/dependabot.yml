version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # 3.53.x finds no native library in the Alpaquita container image ("Linux-Musl"); raise the version only after
      # the "image" job of the CI passes with it
      - dependency-name: "org.xerial:sqlite-jdbc"
    groups:
      spring:
        patterns: ["org.springframework*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
